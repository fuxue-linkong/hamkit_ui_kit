<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HamKit UI Kit — 玻璃拟态组件演示</title>
<style>
  /* ========== 设计令牌（与 uikit/theme/GlassSpec.kt 对应） ========== */
  :root {
    --blur: 20px;             /* 对应 GlassSpec.blurRadius */
    --surface-alpha: 0.16;    /* 对应 GlassSpec.surfaceAlpha */
    --border-alpha: 0.28;     /* 对应 GlassSpec.borderAlpha */
    --radius: 20px;           /* 对应 GlassSpec.cornerRadius */
    --accent: #3D6BFF;
    --on-accent: #FFFFFF;
    --text-primary: #17203D;
    --text-secondary: rgba(23, 32, 61, 0.60);
    --glass-surface: 255, 255, 255;
    --glass-border: 255, 255, 255;
    --backdrop-a: #8EC5FC;
    --backdrop-b: #E0C3FC;
  }
  /* 深色主题令牌（对应 HamColors.Dark） */
  html[data-theme="dark"] {
    --accent: #7C9BFF;
    --on-accent: #0B1030;
    --text-primary: #EDF1FF;
    --text-secondary: rgba(237, 241, 255, 0.62);
    --glass-surface: 16, 26, 51;
    --glass-border: 185, 200, 255;
    --backdrop-a: #0F1B45;
    --backdrop-b: #3B1F6E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    /* 玻璃衬底渐变（对应 GlassBackdrop） */
    background: linear-gradient(135deg, var(--backdrop-a), var(--backdrop-b)) fixed;
    transition: background .4s;
  }
  /* 渐变底上的漂浮色斑，增强玻璃折射感 */
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; z-index: 0; pointer-events: none; }
  .blob-1 { width: 340px; height: 340px; background: #FF8FB1; top: -80px; right: -60px; }
  .blob-2 { width: 300px; height: 300px; background: #7FDCC5; bottom: -60px; left: -70px; }
  main { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 90px 20px 60px; }

  /* ========== 玻璃表面配方（对应 GlassSurface） ========== */
  .glass {
    background: rgba(var(--glass-surface), var(--surface-alpha));
    -webkit-backdrop-filter: blur(var(--blur));
    backdrop-filter: blur(var(--blur));
    border: 1px solid rgba(var(--glass-border), var(--border-alpha));
    border-radius: var(--radius);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
  }

  /* ========== 顶栏 ========== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    height: 64px; border-radius: 0; border-left: none; border-right: none; border-top: none;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .theme-toggle {
    position: absolute; right: 16px; cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    padding: 7px 14px; border-radius: 999px;
    background: rgba(var(--glass-surface), 0.24);
    border: 1px solid rgba(var(--glass-border), var(--border-alpha));
    transition: transform .15s;
  }
  .theme-toggle:active { transform: scale(.95); }

  h2.section { font-size: 15px; font-weight: 700; margin: 34px 0 12px; letter-spacing: .5px; }

  /* ========== 按钮 ========== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 46px; padding: 12px 24px; border-radius: 999px;
    font-size: 15px; font-weight: 600; cursor: pointer; border: none;
    transition: transform .15s, filter .15s; color: var(--text-primary);
  }
  .btn:active { transform: scale(.96); }
  .btn-glass {
    background: rgba(var(--glass-surface), var(--surface-alpha));
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    border: 1px solid rgba(var(--glass-border), var(--border-alpha));
  }
  .btn-emphasis { background: var(--accent); color: var(--on-accent); }
  .btn-block { width: 100%; margin-top: 10px; }

  /* ========== 卡片 ========== */
  .card { padding: 18px; }
  .card h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .card p { font-size: 14px; color: var(--text-secondary); line-height: 1.55; }

  /* ========== 输入框 ========== */
  .field {
    width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(var(--glass-border), var(--border-alpha));
    background: rgba(var(--glass-surface), .14);
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    color: var(--text-primary); font-size: 15px; outline: none;
  }
  .field::placeholder { color: var(--text-secondary); }
  .field:focus { border-color: var(--accent); }

  /* ========== 开关 ========== */
  .switch { position: relative; width: 52px; height: 30px; border-radius: 999px; cursor: pointer;
    background: rgba(var(--glass-surface), var(--surface-alpha));
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    border: 1px solid rgba(var(--glass-border), var(--border-alpha)); transition: background .25s; }
  .switch .thumb { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--text-secondary); transition: transform .25s cubic-bezier(.5,1.6,.4,1), background .25s; }
  .switch.on { background: var(--accent); }
  .switch.on .thumb { transform: translateX(22px); background: var(--on-accent); }

  /* ========== 滑杆 ========== */
  .slider { position: relative; width: 100%; height: 22px; display: flex; align-items: center; cursor: pointer; }
  .slider .track { width: 100%; height: 6px; border-radius: 999px;
    background: rgba(var(--glass-surface), .18); border: 1px solid rgba(var(--glass-border), .18); overflow: hidden; }
  .slider .fill { height: 100%; background: var(--accent); border-radius: 999px; width: 60%; }
  .slider .thumb-dot { position: absolute; left: calc(60% - 11px); width: 22px; height: 22px; border-radius: 50%; background: var(--accent); }

  /* ========== 进度条 ========== */
  .progress { width: 100%; height: 6px; border-radius: 8px; overflow: hidden;
    background: rgba(var(--glass-surface), .18); border: 1px solid rgba(var(--glass-border), .15); }
  .progress .bar { height: 100%; width: 60%; background: var(--accent); border-radius: 8px; }

  /* ========== Chip ========== */
  .chip { display: inline-flex; padding: 9px 16px; border-radius: 999px; font-size: 12px; font-weight: 600;
    cursor: pointer; color: var(--text-primary);
    background: rgba(var(--glass-surface), var(--surface-alpha));
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    border: 1px solid rgba(var(--glass-border), var(--border-alpha)); transition: all .2s; }
  .chip.selected { background: var(--accent); color: var(--on-accent); border-color: transparent; }

  /* ========== 徽标 ========== */
  .badge { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--accent); color: var(--on-accent); }

  /* ========== 底部导航 ========== */
  .bottom-nav { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; padding: 10px 12px; border-radius: 24px; min-width: 300px; justify-content: space-around; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    font-size: 12px; font-weight: 600; color: var(--text-secondary); padding: 2px 12px; }
  .nav-item .dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .nav-item.active { color: var(--accent); }
  .nav-item.active .dot { background: var(--accent); }

  /* 徽标行内布局 */
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- 顶栏：玻璃质感 -->
<header class="topbar glass">
  <h1>HamKit Gallery</h1>
  <span class="theme-toggle" id="themeToggle">🌙 Dark</span>
</header>

<main>
  <h2 class="section">Button 按钮</h2>
  <div class="stack">
    <button class="btn btn-glass">玻璃按钮（默认）</button>
    <button class="btn btn-emphasis">强调按钮（实底扁平）</button>
  </div>

  <h2 class="section">Card 卡片</h2>
  <div class="card glass">
    <h3>玻璃卡片</h3>
    <p>半透明表面 + 1px 半透明描边 + 背景实时模糊，扁平风默认无厚重投影。卡片可承载任意内容。</p>
  </div>

  <h2 class="section">TextField 输入框</h2>
  <input class="field" placeholder="输入点什么…">

  <h2 class="section">Switch 开关</h2>
  <div class="row">
    <div class="switch on" id="switchDemo"><span class="thumb"></span></div>
    <span style="font-size:14px;color:var(--text-secondary)">玻璃轨道 + 实底滑块</span>
  </div>

  <h2 class="section">Slider 滑杆</h2>
  <div class="slider" id="sliderDemo">
    <div class="track"><div class="fill"></div></div>
    <div class="thumb-dot"></div>
  </div>

  <h2 class="section">Progress 进度</h2>
  <div class="progress"><div class="bar"></div></div>

  <h2 class="section">Chip 与 Badge</h2>
  <div class="row">
    <span class="chip selected">Sky</span>
    <span class="chip">Ocean</span>
    <span class="chip">Sunset</span>
    <span class="chip">Mono</span>
    <span class="badge">12</span>
    <span class="badge">NEW</span>
  </div>

  <div style="height:90px"></div>
</main>

<!-- 底部导航：悬浮玻璃条 -->
<nav class="bottom-nav glass">
  <div class="nav-item active">首页<span class="dot"></span></div>
  <div class="nav-item">组件<span class="dot"></span></div>
  <div class="nav-item">关于<span class="dot"></span></div>
</nav>

<script>
  // 明暗主题切换（对应 HamKitThemePreset 明暗两套 HamColors）
  const toggle = document.getElementById('themeToggle');
  let dark = false;
  toggle.addEventListener('click', () => {
    dark = !dark;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    toggle.textContent = dark ? '☀️ Light' : '🌙 Dark';
  });

  // 开关演示
  document.getElementById('switchDemo').addEventListener('click', function () {
    this.classList.toggle('on');
  });

  // 滑杆演示：拖动更新填充与圆点位置
  const slider = document.getElementById('sliderDemo');
  const fill = slider.querySelector('.fill');
  const dot = slider.querySelector('.thumb-dot');
  let dragging = false;
  function updateSlider(clientX) {
    const rect = slider.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    fill.style.width = (pct * 100).toFixed(1) + '%';
    dot.style.left = 'calc(' + (pct * 100).toFixed(1) + '% - 11px)';
  }
  slider.addEventListener('pointerdown', e => { dragging = true; updateSlider(e.clientX); });
  window.addEventListener('pointermove', e => { if (dragging) updateSlider(e.clientX); });
  window.addEventListener('pointerup', () => dragging = false);
</script>
</body>
</html>
